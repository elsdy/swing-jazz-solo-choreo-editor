<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>서버 설정 — 안무 편집기</title>
<!--
  server.py 의 관리 화면이다(2026-09-13).

  **이 화면이 소유하는 것은 보관 위치 하나다.** 모델 폴더와 LLM 설정은 편집기의 `⚙ 설정` 이 갖는다 —
  그 둘은 "어느 디스크에 쌓을지" 와 달리 기기에서 골라도 탈이 없고, 주인이 둘이면 어느 쪽이
  맞는지 아무도 모르게 된다(2026-09-13 결정).

  왜 안무 편집기 안이 아니라 여기 있나 — **보관 위치를 정하는 것은 서버의 일**이기 때문이다.
  편집기는 클라이언트다. 클라이언트가 서버의 디스크를 고르면, 브라우저마다 다른 답을 들고
  같은 서버를 서로 다르게 설정하게 된다(폰과 PC 가 같은 서버를 보면서 설정이 갈렸다).
  그래서 결정권은 서버가 갖고, 편집기는 `GET /api/config` 로 **읽기만** 한다.

  ⚠ 이 파일은 `src/` 를 import 하지 않는다. 앱의 모듈이 아니라 서버의 화면이다 —
    앱이 죽어도, 앱을 아직 안 열었어도 여기는 떠야 한다.
  ⚠ 빌드 도구가 없다. 스타일과 스크립트를 이 파일 안에 그대로 둔다(저장소 규칙).
  ⚠ 폰에서 연다. 누르는 것은 최소 44px 로 잡는다.
-->
<style>
  /* ── 디자인 토큰 — index.html :root 의 「디자인 토큰 한 벌」(RM-17)을 **베껴 둔** 것이다 ──────────
     이 화면은 src/ 도 앱 스타일도 불러오지 않으므로(앱이 죽어도 떠야 한다) 토큰을 따로 둔다.
     ⚠ 앱의 토큰 값을 바꾸면 여기도 같은 값으로 고친다 — 이름과 값이 앱과 한 벌이어야 두 화면이 한 사람이
       만든 것처럼 보인다. 테마는 따르지 않는다(관리 화면은 기본 테마 하나). */
  :root {
    --bg: #0b1220;        --bg-rgb: 11, 18, 32;
    --bg-2: #111827;      --bg-2-rgb: 17, 24, 39;
    --panel: rgba(var(--bg-2-rgb), 0.94);
    --surface: #1f2937;   --surface-rgb: 31, 41, 55;
    --text: #e5e7eb;      --text-rgb: 229, 231, 235;
    --muted: #94a3b8;     --muted-rgb: 148, 163, 184;
    --line: rgba(var(--muted-rgb), 0.16);
    --accent: #22c55e;    --accent-rgb: 34, 197, 94;
    --danger: #ef4444;    --danger-rgb: 239, 68, 68;
    --fs-1: 11px; --fs-2: 12px; --fs-3: 13px; --fs-4: 15px;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
    --r-1: 6px; --r-2: 10px; --r-pill: 999px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 0 40px; background: var(--bg); color: var(--text);
    font: var(--fs-4)/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: var(--sp-3) var(--sp-4); background: rgba(var(--bg-rgb), 0.94); border-bottom: 1px solid var(--line);
    backdrop-filter: blur(6px);
  }
  header h1 { margin: 0; font-size: var(--fs-4); }
  header .spacer { flex: 1; }
  main { max-width: 760px; margin: 0 auto; padding: 0 var(--sp-4); }
  section {
    margin: var(--sp-4) 0; padding: 14px; background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--r-2);
  }
  h2 { margin: 0 0 var(--sp-1); font-size: var(--fs-4); }
  .helper { margin: 0 0 10px; font-size: var(--fs-2); color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--sp-2); margin: var(--sp-2) 0; }
  .label { min-width: 6.5em; font-size: var(--fs-2); color: var(--muted); }
  input[type=text], input[type=password], select {
    flex: 1; min-width: 12em; min-height: 44px; padding: 6px 10px; color: var(--text);
    background: rgba(var(--muted-rgb), 0.10); border: 1px solid var(--line); border-radius: var(--r-1); font-size: var(--fs-4);
  }
  button {
    min-height: 44px; padding: 6px 14px; color: var(--text); background: rgba(var(--muted-rgb), 0.12);
    border: 1px solid var(--line); border-radius: var(--r-1); font-size: var(--fs-4); cursor: pointer;
  }
  button:hover:not(:disabled) { background: rgba(var(--muted-rgb), 0.2); }
  button.accent { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  .path {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: var(--fs-1); color: var(--text);
    background: rgba(var(--muted-rgb), 0.10); border-radius: var(--r-1); padding: 6px var(--sp-2); word-break: break-all;
  }
  .vols { display: flex; flex-direction: column; gap: var(--sp-1); margin: var(--sp-2) 0; }
  .vol {
    display: flex; flex-direction: column; align-items: flex-start; gap: 1px; width: 100%;
    min-height: 44px; padding: 6px 10px; text-align: left; font-size: var(--fs-3);
  }
  .vol.is-current { border-color: rgba(var(--accent-rgb), 0.45); background: rgba(var(--accent-rgb), 0.10); }
  .vol span { font-size: var(--fs-1); color: var(--muted); word-break: break-all; }
  .stat { display: flex; justify-content: space-between; gap: var(--sp-3); padding: 5px 0; border-top: 1px solid var(--line); font-size: var(--fs-3); }
  .stat:first-of-type { border-top: 0; }
  .stat b { font-weight: 600; }
  .stat i { font-style: normal; color: var(--muted); font-size: var(--fs-1); }
  .note { margin-top: var(--sp-2); font-size: var(--fs-2); color: var(--muted); }
  .note.is-error { color: var(--danger); }
  .badge { font-size: var(--fs-1); color: var(--accent); background: rgba(var(--accent-rgb), 0.14);
    border: 1px solid rgba(var(--accent-rgb), 0.25); border-radius: var(--r-pill); padding: 2px var(--sp-2); }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>서버 설정</h1>
  <span class="badge" id="hostBadge">—</span>
  <span class="spacer"></span>
  <a href="/">← 안무 편집기</a>
</header>

<main>
  <section>
    <h2>보관 위치</h2>
    <p class="helper">
      올린 영상과 저장한 안무표가 <b>이 서버의 어느 디스크</b>에 쌓일지 정합니다.
      편집기(브라우저)는 이 값을 읽기만 하므로, 폰에서 보든 PC 에서 보든 같은 자리를 가리킵니다.
    </p>
    <div class="vols" id="vols"></div>
    <div class="row">
      <span class="label">루트</span>
      <input id="root" type="text" placeholder="/절대/경로" />
    </div>
    <div class="row">
      <span class="label">영상 하위 폴더</span>
      <input id="subdir" type="text" placeholder="video-clip" />
    </div>
    <div class="row">
      <span class="label">안무표 하위 폴더</span>
      <input id="projectsSubdir" type="text" placeholder="projects" />
    </div>
    <div class="path" id="preview">—</div>
    <div class="row">
      <button class="accent" id="applyStorage" type="button">적용</button>
      <button id="revertStorage" type="button">되돌리기</button>
    </div>
    <div class="note" id="storageNote"></div>
  </section>

  <section>
    <h2>지금 쌓인 것</h2>
    <p class="helper">보관 위치를 바꾸기 전에 무엇이 얼마나 있는지 봅니다. <b>바꿔도 옛 파일은 따라가지 않습니다</b> — 폴더를 손으로 옮기고 새 자리를 가리키세요.</p>
    <div id="usage"></div>
    <div class="row"><button id="refreshUsage" type="button">다시 읽기</button></div>
  </section>

</main>

<script>
// ⚠ 모듈이 아니다(type=module 아님). 이 화면은 앱과 아무것도 나눠 쓰지 않는다 — 서버의 것이다.
(function () {
  'use strict';

  const $ = (id) => document.getElementById(id);
  const state = { config: null };

  /** 바이트를 사람이 읽는 크기로. 영상은 GB 단위로 쌓이므로 GB 아래는 뭉갠다. */
  function human(bytes) {
    const n = Number(bytes);
    if (!Number.isFinite(n) || n <= 0) return '0';
    if (n >= 1e12) return (n / 1e12).toFixed(1) + 'TB';
    if (n >= 1e9) return (n / 1e9).toFixed(1) + 'GB';
    if (n >= 1e6) return Math.round(n / 1e6) + 'MB';
    return Math.round(n / 1e3) + 'KB';
  }

  /** 던지지 않는 JSON 호출. 관리 화면이 오류 하나로 하얗게 되면 안 된다. */
  async function api(method, path, body) {
    try {
      const res = await fetch(path, {
        method,
        cache: 'no-store',
        headers: body === undefined ? {} : { 'Content-Type': 'application/json' },
        body: body === undefined ? undefined : JSON.stringify(body)
      });
      const data = await res.json().catch(() => null);
      return res.ok ? data : null;
    } catch (e) {
      return null;
    }
  }

  function note(el, text, isError) {
    el.textContent = text;
    el.classList.toggle('is-error', !!isError);
  }

  // ── 보관 위치 ──────────────────────────────────────────────────────────────

  function renderPreview() {
    const root = $('root').value.trim() || '<루트>';
    const sub = $('subdir').value.trim() || 'video-clip';
    const proj = $('projectsSubdir').value.trim() || 'projects';
    $('preview').textContent =
      root + '/' + sub + '/<프로젝트 이름>/<영상 파일>\n' + root + '/' + proj + '/<안무표 이름>.json';
  }

  async function renderVolumes() {
    const data = await api('GET', '/api/volumes');
    const vols = (data && data.volumes) || [];
    const box = $('vols');
    box.textContent = '';
    const chosen = $('root').value.trim();
    for (const v of vols) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'vol' + (v.path === chosen ? ' is-current' : '');
      btn.disabled = !v.writable;
      const b = document.createElement('b');
      b.textContent = (v.path === chosen ? '◉ ' : '○ ') + v.label;
      const s = document.createElement('span');
      s.textContent = (v.writable ? human(v.freeBytes) + ' 남음' : '쓸 수 없음(권한·읽기 전용)') + ' · ' + v.path;
      btn.append(b, s);
      // 누르는 것만으로 서버를 바꾸지 않는다 — 하위 폴더까지 보고 `적용` 을 눌러야 한다.
      btn.onclick = () => { $('root').value = v.path; renderPreview(); renderVolumes(); };
      box.appendChild(btn);
    }
  }

  function fillStorage(cfg) {
    if (!cfg) return;
    $('root').value = cfg.root || '';
    $('subdir').value = cfg.subdir || '';
    $('projectsSubdir').value = cfg.projectsSubdir || '';
    renderPreview();
    renderVolumes();
  }

  async function loadConfig() {
    state.config = await api('GET', '/api/config');
    if (!state.config) {
      note($('storageNote'), '서버 설정을 읽지 못했습니다. server.py 가 켜져 있는지 확인하세요.', true);
      return;
    }
    fillStorage(state.config);
    note($('storageNote'), '지금 영상은 ' + state.config.dir + ' 에, 안무표는 ' + state.config.projectsDir + ' 에 쌓입니다.');
  }

  $('applyStorage').onclick = async () => {
    const next = {
      root: $('root').value.trim(),
      subdir: $('subdir').value.trim(),
      projectsSubdir: $('projectsSubdir').value.trim()
    };
    if (!next.root) { note($('storageNote'), '루트가 비어 있습니다.', true); return; }
    note($('storageNote'), '적용하는 중…');
    const cfg = await api('PUT', '/api/config', next);
    if (!cfg) {
      note($('storageNote'), '그 자리를 쓰지 못했습니다. 경로가 맞는지, 쓰기 권한이 있는지 보세요.', true);
      return;
    }
    state.config = cfg;
    fillStorage(cfg);
    note($('storageNote'), '바뀌었습니다. 지금부터 올리는 영상은 ' + cfg.dir + ' 에 쌓입니다. 옛 파일은 따라가지 않았습니다.');
    loadUsage();
  };

  $('revertStorage').onclick = () => { fillStorage(state.config); note($('storageNote'), ''); };
  $('root').oninput = renderPreview;
  $('subdir').oninput = renderPreview;
  $('projectsSubdir').oninput = renderPreview;

  // ── 지금 쌓인 것 ───────────────────────────────────────────────────────────

  async function loadUsage() {
    const u = await api('GET', '/api/storage');
    const box = $('usage');
    box.textContent = '';
    if (!u) { note($('storageNote'), '보관 현황을 읽지 못했습니다.', true); return; }
    const rows = [
      ['영상', u.clips, u.clipsDir],
      ['안무표', u.projects, u.projectsDir],
      ['자세 분석 모델', u.models, u.modelsDir]
    ];
    for (const [label, usage, dir] of rows) {
      const row = document.createElement('div');
      row.className = 'stat';
      const left = document.createElement('div');
      left.innerHTML = '<b>' + label + '</b><br><i>' + dir + '</i>';
      const right = document.createElement('div');
      right.textContent = usage.count + '개 · ' + human(usage.bytes);
      row.append(left, right);
      box.appendChild(row);
    }
  }
  $('refreshUsage').onclick = loadUsage;

  // ── 시작 ───────────────────────────────────────────────────────────────────

  $('hostBadge').textContent = location.host;
  loadConfig().then(loadUsage);
})();
</script>
</body>
</html>
