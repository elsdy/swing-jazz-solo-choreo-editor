<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>보드 렌더 재기</title>
  <!-- RM-35 — 큰 견본(64마디 · 3층 · 동작 300개)에서 전 행 렌더와 좁힌 렌더를 나란히 잰다.
       앱의 스타일은 index.html 의 <style> 을 그대로 읽어 입힌다 — 같은 CSS 위에서 재야 레이아웃 값이 같다.
       서버(python3 server.py)로 열고 /tools/boardBench.html 로 들어온다. file:// 로는 ES 모듈이 막힌다.
       ⚠ 이 페이지는 앱이 아니다. 좁힌 렌더는 여기에만 있고 src 의 운영 경로에는 없다. -->
  <style id="benchStyle">
    .bench-panel { font: 14px/1.5 system-ui, sans-serif; padding: 16px; max-width: 980px; }
    .bench-panel table { border-collapse: collapse; margin: 8px 0 16px; }
    .bench-panel th, .bench-panel td { border: 1px solid #8884; padding: 4px 10px; text-align: right; }
    .bench-panel th:first-child, .bench-panel td:first-child { text-align: left; }
    .bench-panel .verdict { font-weight: 700; }
    .bench-panel .bad { color: #e11d48; }
    .bench-panel .good { color: #16a34a; }
    .bench-panel button { font: inherit; padding: 4px 12px; }
  </style>
</head>
<body>
  <div class="bench-panel">
    <h1>보드 렌더 재기 — RM-35</h1>
    <p id="benchInfo">견본을 만드는 중…</p>
    <p><button id="benchRun" type="button" disabled>다시 재기</button> <span id="benchStatus"></span></p>
    <div id="benchOut"></div>
  </div>
  <div class="board-wrap" id="mainBoardWrap"><div class="board" id="board"></div></div>
  <script type="module" src="boardBench.mjs"></script>
</body>
</html>
